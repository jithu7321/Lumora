<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumora — A quiet room for focused minds</title>
 
<!-- PWA: installable, works offline, own icon on the home screen -->
<meta name="theme-color" content="#0F172A">
<meta name="description" content="A quiet room for focused minds. A premium, distraction-free study timer.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lumora">
<meta name="mobile-web-app-capable" content="yes">
 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   LUMORA — design tokens
   ============================================================ */
:root{
  --indigo:#4F46E5; --violet:#7C3AED; --mint:#14B8A6; --danger:#EF4444;
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:30px;
  --gap:14px;
  --ff-ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ff-head:'Plus Jakarta Sans','Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.22,.8,.3,1);
  --speed:.28s;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
 
/* dark (default) */
:root{
  --bg:#0F172A; --bg-deep:#0A1020;
  --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.075);
  --border:rgba(255,255,255,.09); --border-soft:rgba(255,255,255,.055);
  --text:#F8FAFC; --text-2:#94A3B8; --text-3:#64748B;
  --shadow:0 18px 48px -18px rgba(0,0,0,.75);
  --glow:rgba(124,58,237,.30);
  --track:rgba(255,255,255,.08);
}
/* respect the viewer's OS setting only when the user hasn't chosen */
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]):not([data-theme="light"]){ color-scheme:light }
}
html[data-theme="light"]{
  --bg:#F8FAFC; --bg-deep:#EEF2F8;
  --surface:#FFFFFF; --surface-2:#F1F5F9;
  --border:#E2E8F0; --border-soft:#EDF1F6;
  --text:#0F172A; --text-2:#475569; --text-3:#7C8BA1;
  --shadow:0 16px 40px -20px rgba(15,23,42,.30);
  --glow:rgba(79,70,229,.22);
  --track:rgba(15,23,42,.09);
  color-scheme:light;
}
html[data-theme="dark"]{color-scheme:dark}
 
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--ff-ui); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
 
/* ambient page wash — the only decorative gradient outside focus mode */
body::before{
  content:'';position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:
    radial-gradient(45% 38% at 18% 6%, rgba(79,70,229,.30), transparent 68%),
    radial-gradient(42% 34% at 88% 16%, rgba(124,58,237,.24), transparent 66%),
    radial-gradient(50% 40% at 50% 104%, rgba(20,184,166,.13), transparent 70%);
  filter:blur(6px);
}
html[data-theme="light"] body::before{opacity:.5}
html[data-anim="off"] body::before{opacity:.28}
 
/* ============================================================
   App shell
   ============================================================ */
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
.screen{display:none;flex:1;padding:22px 20px 112px;max-width:560px;width:100%;margin:0 auto}
.screen.on{display:block}
@media(min-width:900px){ .screen{max-width:880px;padding:40px 32px 130px} }
 
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--ff-head);font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand svg{width:26px;height:26px;flex:none}
h1{font-family:var(--ff-head);font-size:27px;font-weight:700;letter-spacing:-.025em;margin:0 0 4px}
h2{font-family:var(--ff-head);font-size:16px;font-weight:700;letter-spacing:-.01em;margin:0 0 12px}
.sub{color:var(--text-2);margin:0 0 22px;font-size:14.5px}
.section{margin-bottom:26px}
.label{font-size:12.5px;color:var(--text-3);font-weight:500;margin-bottom:9px}
 
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
html[data-theme="dark"] .card{backdrop-filter:blur(14px)}
 
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chips.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.chips.grid2 .chip{justify-content:flex-start;min-width:0}
.chips.grid2 .chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{
  display:inline-flex;align-items:center;gap:8px;padding:11px 15px;min-height:44px;
  border-radius:999px;border:1px solid var(--border);background:var(--surface);
  font-size:14px;font-weight:500;transition:transform var(--speed) var(--ease),border-color var(--speed),background var(--speed);
}
.chip:hover{border-color:var(--text-3)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{border-color:transparent;background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--sc,var(--indigo));color:var(--text)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--sc,var(--indigo));flex:none}
.chip.ghost{border-style:dashed;color:var(--text-2)}
 
/* the hero action */
.start{
  position:relative;width:100%;min-height:62px;margin-top:8px;border-radius:var(--r-xl);
  background:linear-gradient(115deg,#3F35D9 0%,var(--indigo) 38%,var(--violet) 100%);
  color:#fff;font-family:var(--ff-head);font-weight:800;font-size:16.5px;letter-spacing:.01em;
  box-shadow:0 14px 34px -12px var(--glow),inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform .2s var(--ease),box-shadow .3s var(--ease);
}
.start:hover{box-shadow:0 20px 44px -12px var(--glow),inset 0 1px 0 rgba(255,255,255,.28)}
.start:active{transform:scale(.978)}
.start:disabled{opacity:.45;box-shadow:none}
 
.btn{padding:12px 18px;min-height:46px;border-radius:14px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:14.5px;transition:transform .2s var(--ease),border-color .2s}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:var(--text-3)}
.btn.solid{background:linear-gradient(115deg,var(--indigo),var(--violet));border-color:transparent;color:#fff}
.btn.mint{background:var(--mint);border-color:transparent;color:#04211E}
.btn.danger{color:var(--danger);border-color:rgba(239,68,68,.35)}
.btn.wide{width:100%}
.row{display:flex;gap:10px}
.row>*{flex:1}
 
/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap)}
@media(min-width:620px){ .stats{grid-template-columns:repeat(4,1fr)} }
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:15px}
.stat b{display:block;font-family:var(--ff-head);font-size:25px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.stat span{font-size:12.5px;color:var(--text-3)}
 
/* goal meter */
.meter{height:11px;border-radius:999px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--indigo),var(--violet));transition:width .7s var(--ease)}
.meter.done i{background:linear-gradient(90deg,var(--mint),#22D3A5)}
 
/* subject time list */
.list{display:flex;flex-direction:column;gap:2px}
.line{display:flex;align-items:center;gap:11px;padding:11px 2px}
.line + .line{border-top:1px solid var(--border-soft)}
.line .nm{flex:1;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line .vl{color:var(--text-2);font-variant-numeric:tabular-nums;font-size:14px}
.bar{height:6px;border-radius:999px;background:var(--track);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:999px}
 
/* weekly chart */
.week{display:flex;align-items:flex-end;gap:7px;height:132px;margin-top:6px;min-width:0}
.week .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%}
.week .stack{flex:1;width:100%;min-width:0;display:flex;align-items:flex-end}
.week .fill{width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--violet),var(--indigo));min-height:3px;transition:height .6s var(--ease)}
.week .col.today .fill{background:linear-gradient(180deg,#2DD4BF,var(--mint))}
.week .col.zero .fill{background:var(--track)}
.week .d{font-size:11px;color:var(--text-3);font-weight:500;max-width:100%;overflow:hidden;text-overflow:clip;white-space:nowrap}
 
/* tasks */
.task{display:flex;align-items:flex-start;gap:12px;padding:13px 0}
.task + .task{border-top:1px solid var(--border-soft)}
.check{width:23px;height:23px;flex:none;margin-top:1px;border-radius:7px;border:1.6px solid var(--border);display:grid;place-items:center;transition:all .2s var(--ease)}
.check svg{width:13px;height:13px;stroke-dasharray:22;stroke-dashoffset:22;stroke:#fff}
.task.done .check{background:var(--mint);border-color:var(--mint)}
.task.done .check svg{stroke-dashoffset:0;transition:stroke-dashoffset .35s var(--ease)}
.task.done .tt{text-decoration:line-through;color:var(--text-3)}
.tmeta{font-size:12.5px;color:var(--text-3);margin-top:3px}
.tbody{flex:1;min-width:0}
.tt{font-weight:500;overflow-wrap:anywhere}
 
/* inputs */
.field{display:flex;gap:9px;align-items:center}
.input{flex:1;padding:12px 14px;min-height:46px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);width:100%}
.input::placeholder{color:var(--text-3)}
.num{width:82px;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);font-variant-numeric:tabular-nums}
 
/* settings rows */
.set{display:flex;align-items:center;gap:14px;padding:14px 0}
.set + .set{border-top:1px solid var(--border-soft)}
.set .sl{flex:1;min-width:0}
.set .sl b{display:block;font-weight:500;font-size:14.5px}
.set .sl span{font-size:12.5px;color:var(--text-3)}
.sw{width:48px;height:29px;border-radius:999px;background:var(--track);position:relative;flex:none;transition:background .25s var(--ease)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{background:linear-gradient(90deg,var(--indigo),var(--violet))}
.sw[aria-checked="true"]::after{transform:translateX(19px)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;white-space:nowrap}
@media(max-width:400px){
  .set{flex-wrap:wrap}
  .set .sl{flex-basis:100%}
  .set .seg,.set input[type="range"]{width:100%}
}
.seg button{padding:8px 13px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--text-2);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.18)}
html[data-theme="light"] .seg button[aria-pressed="true"]{background:#fff}
 
/* nav */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;justify-content:center;gap:4px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--bg) 88%, transparent);
  backdrop-filter:blur(18px);border-top:1px solid var(--border-soft);
}
.nav button{flex:1;max-width:132px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0 5px;color:var(--text-3);font-size:11px;font-weight:500;border-radius:12px;min-height:50px}
.nav button svg{width:21px;height:21px}
.nav button[aria-current="page"]{color:var(--text)}
.nav button[aria-current="page"] svg{stroke:url(#navgrad)}
 
/* ============================================================
   FOCUS MODE — owns the whole screen
   ============================================================ */
.focus{
  position:fixed;inset:0;z-index:100;display:none;
  background:var(--bg-deep);color:#F8FAFC;
  padding:calc(24px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px));
}
html[data-theme="light"] .focus{background:#0F172A}
.focus.on{display:block}
#fxCanvas,.fxbg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fxbg span{
  position:absolute;border-radius:50%;filter:blur(72px);opacity:.55;
  animation:drift 26s var(--ease) infinite alternate;
}
.fxbg span:nth-child(1){width:60vmin;height:60vmin;left:-14vmin;top:-10vmin;background:#4F46E5}
.fxbg span:nth-child(2){width:54vmin;height:54vmin;right:-12vmin;top:18vmin;background:#7C3AED;animation-duration:32s;animation-delay:-8s}
.fxbg span:nth-child(3){width:64vmin;height:64vmin;left:16vmin;bottom:-24vmin;background:#312E81;animation-duration:38s;animation-delay:-16s}
@keyframes drift{ from{transform:translate3d(0,0,0) scale(1)} to{transform:translate3d(5vmin,-6vmin,0) scale(1.16)} }
.focus[data-phase="break"] .fxbg span:nth-child(1){background:#0D9488}
.focus[data-phase="break"] .fxbg span:nth-child(2){background:#14B8A6}
.focus[data-phase="break"] .fxbg span:nth-child(3){background:#134E4A}
.fxbg span{transition:background 1.1s var(--ease)}
html[data-anim="off"] .fxbg span{animation:none;opacity:.42}
html[data-anim="off"] #fxCanvas{display:none}
 
.fxwrap{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,3.4vh,34px);text-align:center;max-width:620px;margin:0 auto}
.fxsubject{font-family:var(--ff-head);font-weight:700;font-size:clamp(15px,2.4vmin,19px);letter-spacing:.16em;text-transform:uppercase;color:rgba(248,250,252,.82)}
.fxtask{font-size:13.5px;color:rgba(248,250,252,.55);margin-top:5px;max-width:34ch}
 
.ringbox{position:relative;width:min(78vmin,420px);aspect-ratio:1}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-track{fill:none;stroke:rgba(255,255,255,.10);stroke-width:3.2}
.ring-prog{fill:none;stroke:url(#ringgrad);stroke-width:3.2;stroke-linecap:round;
  filter:drop-shadow(0 0 7px rgba(124,58,237,.65));
  transition:stroke-dashoffset .3s linear}
.focus[data-phase="break"] .ring-prog{stroke:url(#ringmint);filter:drop-shadow(0 0 7px rgba(20,184,166,.6))}
.ringcore{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.fxtime{
  font-size:clamp(56px,17.5vmin,132px);font-weight:200;letter-spacing:-.045em;line-height:1;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
}
.fxphase{font-size:clamp(11px,2vmin,13.5px);letter-spacing:.24em;text-transform:uppercase;color:rgba(248,250,252,.6);font-weight:600}
.breathe{animation:breathe 5.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.86}}
html[data-anim="off"] .breathe{animation:none}
.focus.paused .ringbox{opacity:.46;transition:opacity .35s var(--ease)}
.focus.paused .ring-prog{filter:none}
 
.dots{display:flex;gap:8px;align-items:center;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.22);transition:all .4s var(--ease)}
.dots i.done{background:rgba(255,255,255,.75)}
.dots i.now{background:#fff;width:26px;border-radius:999px;box-shadow:0 0 12px rgba(255,255,255,.55)}
.fxmeta{font-size:13px;color:rgba(248,250,252,.62);font-variant-numeric:tabular-nums}
.fxnext{font-size:12.5px;color:rgba(248,250,252,.45)}
.fxctl{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.fbtn{
  min-width:140px;min-height:52px;padding:14px 26px;border-radius:999px;
  border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);
  color:#F8FAFC;font-weight:700;font-size:14.5px;letter-spacing:.06em;text-transform:uppercase;
  backdrop-filter:blur(10px);transition:transform .2s var(--ease),background .2s
}
.fbtn:hover{background:rgba(255,255,255,.15)}
.fbtn:active{transform:scale(.96)}
.fbtn.primary{background:#F8FAFC;color:#14163A;border-color:transparent}
.fbtn.primary:hover{background:#fff}
.fbtn.quiet{min-width:0;border-color:transparent;background:none;color:rgba(248,250,252,.55);text-transform:none;letter-spacing:0;font-weight:500}
.fbtn.quiet:hover{color:#F8FAFC;background:rgba(255,255,255,.07)}
 
/* focus corner controls */
.fxtop{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 6px;z-index:3}
.icobtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:rgba(248,250,252,.62);transition:background .2s,color .2s}
.icobtn:hover{background:rgba(255,255,255,.1);color:#fff}
.icobtn svg{width:20px;height:20px}
.icobtn[aria-pressed="true"]{color:var(--mint)}
 
/* completion / break panels */
.panel{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.6vh,26px);text-align:center;max-width:460px;margin:0 auto}
.seal{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2)}
.seal svg{width:42px;height:42px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .55s .12s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
html[data-anim="off"] .seal svg{animation:none;stroke-dashoffset:0}
.seal.mint{background:rgba(20,184,166,.16);border-color:rgba(20,184,166,.45)}
.ptitle{font-family:var(--ff-head);font-size:clamp(20px,4.6vmin,30px);font-weight:700;letter-spacing:-.02em}
.pbig{font-size:clamp(40px,11vmin,74px);font-weight:200;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.psub{color:rgba(248,250,252,.66);font-size:14.5px}
.tips{display:flex;flex-direction:column;gap:9px;text-align:left;width:100%;max-width:290px}
.tips div{display:flex;gap:11px;align-items:center;color:rgba(248,250,252,.78);font-size:14.5px}
.tips i{width:6px;height:6px;border-radius:50%;background:var(--mint);flex:none}
 
/* modal */
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(5,8,20,.68);backdrop-filter:blur(6px)}
.modal.on{display:flex}
.modal .box{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;max-width:380px;width:100%;box-shadow:var(--shadow)}
.modal h3{font-family:var(--ff-head);margin:0 0 8px;font-size:19px;font-weight:700}
.modal p{margin:0 0 20px;color:var(--text-2);font-size:14.5px}
 
/* toast */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);z-index:300;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:12px 20px;border-radius:999px;
  font-size:14px;font-weight:500;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .3s var(--ease);backdrop-filter:blur(14px);max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.focus.on ~ .toast{bottom:calc(30px + env(safe-area-inset-bottom,0px))}
 
/* onboarding */
.ob{position:fixed;inset:0;z-index:150;display:none;background:var(--bg-deep);color:#F8FAFC;
  padding:calc(30px + env(safe-area-inset-top,0px)) 24px calc(30px + env(safe-area-inset-bottom,0px))}
.ob.on{display:block}
.obwrap{position:relative;height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column}

<script>
/* ============================================================
   LUMORA — study timer
   Layers: Store → State → TimerEngine → Audio/Notify/Wake → UI
   The engine is timestamp-based and never trusts an interval.
   ============================================================ */
(function () {
"use strict";
 
/* ---------- tiny helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const el = (id) => document.getElementById(id);
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const now = () => Date.now();
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
 
function fmtClock(ms) {
  ms = Math.max(0, ms);
  const t = Math.round(ms / 1000);
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  const p = (n) => String(n).padStart(2, "0");
  return h > 0 ? h + ":" + p(m) + ":" + p(s) : p(m) + ":" + p(s);
}

  const mins = Math.round(ms / 60000);
  if (mins < 60) return mins + "m";
  const h = Math.floor(mins / 60), m = mins % 60;
  return m ? h + "h " + m + "m" : h + "h";
}
function fmtDurLong(ms) {
  const mins = Math.floor(ms / 60000);
  const h = Math.floor(mins / 60), m = mins % 60;

/* ---------- icons ---------- */
const I = {

  hist: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-6M12 20V5M19 20v-9"/></svg>',

  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></svg>',

  mute: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="m16 10 5 5M21 10l-5 5"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
};
 
/* ============================================================
   1. STORE — localStorage with graceful degradation
   ============================================================ */
const Store = (function () {
  const mem = {};
  let warned = false;
  function fail() {
    if (!warned) { warned = true; setTimeout(() => toast("Storage is unavailable — this session won't be saved."), 900); }
  }
  return {
    get(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw == null) return key in mem ? mem[key] : fallback;
        return JSON.parse(raw);
      } catch (e) { fail(); return key in mem ? mem[key] : fallback; }
    },
    set(key, val) {
      mem[key] = val;
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { fail(); }
    },
    del(key) { delete mem[key]; try { localStorage.removeItem(key); } catch (e) { } }
  };
})();
 
/* ============================================================
   2. STATE
   ============================================================ */
const DEFAULT_SUBJECTS = [
  { id: "sb1", name: "Mathematics", color: "#6366F1" },
  { id: "sb2", name: "Physics", color: "#3B82F6" },
  { id: "sb3", name: "Chemistry", color: "#A855F7" },
  { id: "sb4", name: "Programming", color: "#06B6D4" },
  { id: "sb5", name: "English", color: "#8B5CF6" },
  { id: "sb6", name: "Revision", color: "#14B8A6" },
];
const PALETTE = ["#6366F1", "#3B82F6", "#A855F7", "#06B6D4", "#8B5CF6", "#14B8A6", "#F59E0B", "#EC4899"];
 
const DEFAULT_SETTINGS = {
  focusMin: 25, shortMin: 5, longMin: 15, sessions: 4,
  deepMin: 50, countMin: 90,
  theme: "system", animations: true, gradientIntensity: "full",
  ambient: "none", ambientVol: 0.45, audioMuted: false, completionSound: true, haptics: true,
  autoBreak: true, autoFocus: false, keepAwake: true,
  notifyFocus: true, notifyBreak: true,
  dailyGoalMin: 180,
};
 
let S = {
  onboarded: Store.get("lumora.onboarded", false),
  subjects: Store.get("lumora.subjects", DEFAULT_SUBJECTS),
  tasks: Store.get("lumora.tasks", []),
  sessions: Store.get("lumora.sessions", []),
  settings: Object.assign({}, DEFAULT_SETTINGS, Store.get("lumora.settings", {})),
  draft: Object.assign({ subjectId: "sb1", taskId: null, mode: "pomodoro", minutes: 25, sessions: 4 }, Store.get("lumora.draft", {})),
};
function persist(what) {
  if (!what || what === "subjects") Store.set("lumora.subjects", S.subjects);
  if (!what || what === "tasks") Store.set("lumora.tasks", S.tasks);
  if (!what || what === "sessions") Store.set("lumora.sessions", S.sessions);
  if (!what || what === "settings") Store.set("lumora.settings", S.settings);
  if (!what || what === "draft") Store.set("lumora.draft", S.draft);
}
const subjectById = (id) => S.subjects.find(s => s.id === id) || S.subjects[0] || { id: "x", name: "Study", color: "#6366F1" };
const taskById = (id) => S.tasks.find(t => t.id === id) || null;
 
/* ============================================================
   3. STATISTICS
   ============================================================ */
const Stats = {
  onDay(ts) {
    const k = dayKey(ts);
    return S.sessions.filter(s => dayKey(s.completedAt) === k);
  },
  totalMs(list) { return list.reduce((a, s) => a + s.actualMs, 0); },
  between(fromTs, toTs) { return S.sessions.filter(s => s.completedAt >= fromTs && s.completedAt < toTs); },
  bySubject(list) {
    const map = {};
    list.forEach(s => { map[s.subjectId] = (map[s.subjectId] || 0) + s.actualMs; });
    return Object.keys(map).map(id => ({ subject: subjectById(id), ms: map[id] })).sort((a, b) => b.ms - a.ms);
  },
  streak() {
    if (!S.sessions.length) return { current: 0, longest: 0 };
    const days = {};
    S.sessions.forEach(s => { days[dayKey(s.completedAt)] = true; });
    const keys = Object.keys(days).sort();
    // longest run of consecutive days
    let longest = 0, run = 0, prev = null;
    keys.forEach(k => {
      const t = new Date(k + "T00:00:00").getTime();
      run = (prev !== null && t - prev === 86400000) ? run + 1 : 1;
      prev = t; longest = Math.max(longest, run);
    });
    // current streak counts back from today (or yesterday if nothing today yet)
    let cur = 0, cursor = startOfDay(now());
    if (!days[dayKey(cursor)]) cursor -= 86400000;
    while (days[dayKey(cursor)]) { cur++; cursor -= 86400000; }
    return { current: cur, longest: Math.max(longest, cur) };
  },
  week() {
    const out = [];
    const today = startOfDay(now());
    const monday = today - ((new Date(today).getDay() + 6) % 7) * 86400000;
    for (let i = 0; i < 7; i++) {
      const d = monday + i * 86400000;
      out.push({ ts: d, label: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"][i], ms: Stats.totalMs(Stats.between(d, d + 86400000)), today: d === today });
    }
    return out;
  }
};
 
/* ============================================================
   4. AUDIO — procedural ambience + completion tones (no assets)
   ============================================================ */
const Sound = (function () {
  let ctx = null, chain = null, master = null, available = true;
  const PRESETS = {
    rain: { noise: "white", filter: ["lowpass", 5000, 0.8], hp: 320, lfo: [0.22, 0.16] },
    ocean: { noise: "brown", filter: ["lowpass", 760, 0.9], lfo: [0.09, 0.55] },
    forest: { noise: "white", filter: ["bandpass", 1900, 0.65], lfo: [0.14, 0.32] },
    library: { noise: "brown", filter: ["lowpass", 300, 0.7], lfo: [0.05, 0.14] },
    brown: { noise: "brown", filter: ["lowpass", 1500, 0.7] },
    white: { noise: "white", filter: ["lowpass", 12000, 0.7] },
    cafe: { noise: "brown", filter: ["bandpass", 720, 0.5], lfo: [0.3, 0.3] },
    fan: { noise: "brown", filter: ["lowpass", 950, 1.1], lfo: [5.5, 0.05] },
  };
  const LABELS = { none: "Off", rain: "Rain", ocean: "Ocean", forest: "Forest", library: "Library", brown: "Brown noise", white: "White noise", cafe: "Cafe", fan: "Soft fan" };
 
  function ac() {
    if (ctx) return ctx;
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) { available = false; return null; }
      ctx = new C();
    } catch (e) { available = false; return null; }
    return ctx;
  }
  function noiseBuffer(c, kind) {
    const len = c.sampleRate * 4;
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    if (kind === "brown") {
      let last = 0;
      for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.4; }
    } else {
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    return buf;
  }
  function stop() {
    if (!chain) return;
    try {
      chain.gain.gain.cancelScheduledValues(ctx.currentTime);
      chain.gain.gain.setTargetAtTime(0, ctx.currentTime, 0.25);
      const c = chain; chain = null;
      setTimeout(() => { try { c.src.stop(); c.lfo && c.lfo.stop(); } catch (e) { } }, 900);
    } catch (e) { chain = null; }
  }
  function start(name) {
    stop();
    if (!name || name === "none") return;
    const c = ac(); if (!c) { toast("Sound isn't available on this device."); return; }
    if (c.state === "suspended") c.resume().catch(() => { });
    const p = PRESETS[name]; if (!p) return;
    try {
      const src = c.createBufferSource();
      src.buffer = noiseBuffer(c, p.noise); src.loop = true;
      let node = src;
      if (p.hp) { const hp = c.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = p.hp; node.connect(hp); node = hp; }
      const f = c.createBiquadFilter();
      f.type = p.filter[0]; f.frequency.value = p.filter[1]; f.Q.value = p.filter[2];
      node.connect(f);
      const gain = c.createGain();
      gain.gain.value = 0;
      f.connect(gain); gain.connect(c.destination);
      const vol = S.settings.ambientVol;
      gain.gain.setTargetAtTime(vol, c.currentTime, 1.1);
      let lfo = null;
      if (p.lfo) {
        lfo = c.createOscillator(); lfo.frequency.value = p.lfo[0];
        const amt = c.createGain(); amt.gain.value = vol * p.lfo[1];
        lfo.connect(amt); amt.connect(gain.gain); lfo.start();
      }
      src.start();
      chain = { src, gain, lfo };
    } catch (e) { available = false; toast("Sound isn't available on this device."); }
  }
  function setVol(v) {
    if (chain && ctx) { try { chain.gain.gain.setTargetAtTime(v, ctx.currentTime, 0.12); } catch (e) { } }
  }
  function tone(freqs, dur, peak) {
    if (!S.settings.completionSound || S.settings.audioMuted) return;
    const c = ac(); if (!c) return;
    if (c.state === "suspended") c.resume().catch(() => { });
    try {
      freqs.forEach((f, i) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = "sine"; o.frequency.value = f;
        const t0 = c.currentTime + i * 0.17;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(peak, t0 + 0.04);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(c.destination);
        o.start(t0); o.stop(t0 + dur + 0.05);
      });
    } catch (e) { }
  }
  return {
    LABELS, start, stop, setVol,
    resume() { const c = ac(); if (c && c.state === "suspended") c.resume().catch(() => { }); },
    focusDone() { tone([587.33, 783.99, 1046.5], 1.5, 0.16); buzz([30, 60, 30]); },
    breakDone() { tone([440, 659.25], 1.1, 0.13); buzz([22]); },
    routineDone() { tone([523.25, 659.25, 783.99, 1046.5], 2.1, 0.19); buzz([40, 70, 40, 70, 60]); },
    tick() { tone([880], 0.28, 0.07); },
    get playing() { return !!chain; }
  };
  function buzz(pattern) {
    if (!S.settings.haptics) return;
    try { navigator.vibrate && navigator.vibrate(pattern); } catch (e) { }
  }
})();
/* ============================================================
   CUSTOM USER AUDIO
   ============================================================ */
const CustomAudio = (() => {
  const DB_NAME = "LumoraCustomAudioDB";
  const STORE_NAME = "audio";
  const AUDIO_KEY = "custom";

  let audio = null;
  let objectUrl = "";
  let fileName = "";
  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;

    dbPromise = new Promise((resolve, reject) => {
      if (!window.indexedDB) {
        reject(new Error("IndexedDB is not supported by this browser."));
        return;
      }

      const request = indexedDB.open(DB_NAME, 1);

      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME);
        }
      };

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error("Could not open audio storage."));
    });

    return dbPromise;
  }

  async function dbGet() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const request = tx.objectStore(STORE_NAME).get(AUDIO_KEY);
      request.onsuccess = () => resolve(request.result || null);
      request.onerror = () => reject(request.error || new Error("Could not read audio storage."));
    });
  }

  async function dbPut(record) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).put(record, AUDIO_KEY);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error || new Error("Could not save audio."));
      tx.onabort = () => reject(tx.error || new Error("Could not save audio."));
    });
  }

  async function dbDelete() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).delete(AUDIO_KEY);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error || new Error("Could not remove audio."));
      tx.onabort = () => reject(tx.error || new Error("Could not remove audio."));
    });
  }

  function updateStatus() {
    const status = document.getElementById("customSoundStatus");
    if (!status) return;
    status.textContent = fileName
      ? "Selected: " + fileName
      : "No custom audio selected";
  }

  function destroyAudio() {
    if (audio) {
      try {
        audio.pause();
        audio.currentTime = 0;
      } catch (e) { }
      audio = null;
    }

    if (objectUrl) {
      URL.revokeObjectURL(objectUrl);
      objectUrl = "";
    }
  }

  async function ensureAudio() {
    if (audio) return audio;

    const record = await dbGet();
    if (!record || !record.blob) return null;

    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(record.blob);

    audio = new Audio(objectUrl);
    audio.loop = true;
    audio.preload = "auto";
    audio.volume = S.settings.ambientVol;

    fileName = record.name || fileName || "Custom audio";
    updateStatus();

    return audio;
  }

  async function save(file) {
    if (!file) return;

    if (!file.type || !file.type.startsWith("audio/")) {
      toast("Please select an audio file.");
      return;
    }

    try {
      await dbPut({
        blob: file,
        name: file.name,
        type: file.type,
        size: file.size,
        savedAt: Date.now()
      });

      destroyAudio();
      fileName = file.name;
      updateStatus();
      toast("Custom audio added.");
    } catch (e) {
      console.error("Lumora custom audio save failed:", e);
      toast("Could not save this audio file on your device.");
    }
  }

  async function play(options = {}) {
    if (S.settings.audioMuted) return;
    try {
      const a = await ensureAudio();

      if (!a) {
        toast("Choose a custom audio file first.");
        return;
      }

      /* A new focus session must always start the custom track from the
         beginning. This also fixes the case where the previous session
         reached the end of the track before the next session started. */
      if (options.restart !== false) {
        try {
          a.pause();
          a.currentTime = 0;
        } catch (e) { }
      }

      a.loop = true;
      a.volume = S.settings.ambientVol;

      /* If the browser has moved the media element to an ended state,
         explicitly reload it before starting the next session. */
      if (a.ended) {
        try { a.load(); } catch (e) { }
        try { a.currentTime = 0; } catch (e) { }
      }

      await a.play();
    } catch (e) {
      console.error("Lumora custom audio playback failed:", e);
      toast("Tap Test again to allow audio playback.");
    }
  }

  function stop() {
    if (!audio) return;
    try {
      audio.pause();
      audio.currentTime = 0;
    } catch (e) { }
  }

  /* Mute only pauses the track. It deliberately does NOT reset currentTime. */
  function pauseForMute() {
    if (!audio) return;
    try { audio.pause(); } catch (e) { }
  }

  async function remove() {
    stop();
    destroyAudio();

    try {
      await dbDelete();
      fileName = "";
      updateStatus();
      toast("Custom audio removed.");
    } catch (e) {
      console.error("Lumora custom audio remove failed:", e);
      toast("Could not remove the custom audio.");
    }
  }

  function hasSound() {
    return !!fileName;
  }

  function setVolume(v) {
    if (audio) audio.volume = clamp(v, 0, 1);
  }

  async function syncVolume() {
    setVolume(S.settings.ambientVol);
  }

  async function init() {
    try {
      const record = await dbGet();
      fileName = record && record.name ? record.name : "";
      updateStatus();
    } catch (e) {
      console.error("Lumora custom audio initialization failed:", e);
      updateStatus();
    }
  }

  return {
    play,
    stop,
    pauseForMute,
    save,
    remove,
    hasSound,
    setVolume,
    syncVolume,
    updateStatus,
    init
  };
})();

const Notify = {
  supported: typeof Notification !== "undefined",
  async ask() {
    if (!Notify.supported) return "unsupported";
    try {
      if (Notification.permission === "default") return await Notification.requestPermission();
      return Notification.permission;
    } catch (e) { return "denied"; }
  },
  send(body, kind) {

    if (kind === "break" && !S.settings.notifyBreak) return;
    if (!Notify.supported || Notification.permission !== "granted") return;
    try { new Notification("Lumora", { body, tag: "lumora", silent: true }); } catch (e) { }
  }
};
const Wake = {
  lock: null,
  async on() {
    if (!S.settings.keepAwake || !("wakeLock" in navigator)) return;
    try { Wake.lock = await navigator.wakeLock.request("screen"); Wake.lock.addEventListener("release", () => { Wake.lock = null; }); } catch (e) { }
  },
  off() { try { Wake.lock && Wake.lock.release(); } catch (e) { } Wake.lock = null; }
};
 
/* ============================================================
   6. TIMER ENGINE — pure, timestamp-driven, UI-independent
   ============================================================ */
const Engine = (function () {
  const KEY = "lumora.run";
  let st = null;              // run state, or null when idle
  let listeners = [];
  const emit = (ev) => listeners.forEach(f => f(ev, st));
 
  function save() { if (st) Store.set(KEY, st); else Store.del(KEY); }
 
  function buildPlan(cfg) {
    const plan = [];
    const M = 60000;
    if (cfg.mode === "pomodoro") {
      const n = clamp(cfg.sessions || 4, 1, 8);
      for (let i = 0; i < n; i++) {
        plan.push({ type: "focus", ms: cfg.minutes * M });
        if (i < n - 1) plan.push({ type: "short", ms: S.settings.shortMin * M });
        else plan.push({ type: "long", ms: S.settings.longMin * M });
      }
    } else if (cfg.mode === "deep") {
      plan.push({ type: "focus", ms: cfg.minutes * M });
      plan.push({ type: "long", ms: S.settings.longMin * M });
    } else {
      plan.push({ type: "focus", ms: cfg.minutes * M });
    }
    return plan;
  }
 
  const api = {
    onChange(fn) { listeners.push(fn); },
    get state() { return st; },
    get active() { return !!st; },
 
    step() { return st ? st.plan[st.idx] : null; },
    focusStepCount() { return st ? st.plan.filter(p => p.type === "focus").length : 0; },
    focusStepNumber() { return st ? st.plan.slice(0, st.idx + 1).filter(p => p.type === "focus").length : 0; },
    nextStep() { return st && st.plan[st.idx + 1] ? st.plan[st.idx + 1] : null; },
 
    elapsed() {
      if (!st) return 0;
      const end = st.pausedAt || now();
      return Math.max(0, end - st.startedAt - st.pausedMs);
    },
    remaining() {
      const s = api.step();
      return s ? Math.max(0, s.ms - api.elapsed()) : 0;
    },
    progress() {
      const s = api.step();
      return s ? clamp(api.elapsed() / s.ms, 0, 1) : 0;
    },
 
    start(cfg) {
      const plan = buildPlan(cfg);
      if (!plan.length || !plan[0].ms || plan[0].ms < 1000) { toast("Choose a duration of at least 1 minute."); return false; }
      st = {
        plan, idx: 0, mode: cfg.mode,
        subjectId: cfg.subjectId, taskId: cfg.taskId || null,
        startedAt: now(), pausedAt: null, pausedMs: 0,
        stage: "running", startedIso: new Date().toISOString()
      };
      save(); emit("start"); return true;
    },
 
    pause() {
      if (!st || st.stage !== "running" || st.pausedAt) return;
      st.pausedAt = now(); save(); emit("pause");
    },
    resume() {
      if (!st || !st.pausedAt) return;
      st.pausedMs += now() - st.pausedAt;
      st.pausedAt = null; save(); emit("resume");
    },
    get paused() { return !!(st && st.pausedAt); },
 
    /* move to the next step and start it */
    advance(atTs) {
      if (!st) return;
      if (st.idx + 1 >= st.plan.length) { st.stage = "routineDone"; save(); emit("routineDone"); return; }
      st.idx++;
      st.startedAt = atTs || now();
      st.pausedAt = null; st.pausedMs = 0;
      st.stage = "running";
      save(); emit("advance");
    },
 
    /* skip the break we're on (or the one coming up) and go to the next focus */
    skipBreak() {
      if (!st) return;
      let i = st.idx;
      if (st.plan[i].type === "focus") i++;             // from the "session complete" screen
      while (st.plan[i] && st.plan[i].type !== "focus") i++;
      if (!st.plan[i]) { st.stage = "routineDone"; save(); emit("routineDone"); return; }
      st.idx = i; st.startedAt = now(); st.pausedAt = null; st.pausedMs = 0; st.stage = "running";
      save(); emit("advance");
    },
 
    /* end early. Records partial focus time so nothing is lost. */
    end() {
      if (!st) return;
      const s = api.step();
      if (s && s.type === "focus" && st.stage === "running") {
        const done = api.elapsed();
        if (done >= 60000) recordSession(st, done, now(), true);
      }
      const summary = st;
      st = null; save(); emit("end", summary);
    },
 
    finish() { const s = st; st = null; save(); emit("end", s); },
 
    /* The heartbeat. Recomputes purely from timestamps, so it is correct whether
       it last ran 250ms ago or the laptop was asleep for an hour.
 
       Catch-up rule: a break that elapsed while the student was away is fine to
       roll through — that is what breaks are. A *focus* session is only ever
       credited if it was the one actually running when they left. We never
       auto-start a focus session nobody was present for, so the app can't
       invent study time. */
    tick() {
      if (!st || st.stage !== "running" || st.pausedAt) return;
      let guard = 0;
      while (st && st.stage === "running" && !st.pausedAt && api.remaining() <= 0 && guard++ < 20) {
        const s = api.step();
        const endedAt = st.startedAt + st.pausedMs + s.ms;
        const away = now() - endedAt > 2000;
        const hasNext = !!st.plan[st.idx + 1];
 
        if (s.type === "focus") {
          recordSession(st, s.ms, endedAt, false);
          st.stage = hasNext ? "sessionDone" : "routineDone";
          save(); emit(hasNext ? "sessionDone" : "routineDone");
          // roll into the break only when catching up; when live, the UI shows
          // the completion panel first and advances on its own timer.
          if (away && hasNext && S.settings.autoBreak) api.advance(endedAt); else break;
        } else {
          st.stage = hasNext ? "breakDone" : "routineDone";
          save(); emit(hasNext ? "breakDone" : "routineDone");
          // never auto-start a focus session during catch-up — wait for them.
          if (!away && hasNext && S.settings.autoFocus) break;
          break;
        }
      }
    },
 
    restore() {
      const saved = Store.get(KEY, null);
      if (!saved || !saved.plan || !saved.plan.length) return false;
      // a run older than 12h is stale; drop it rather than showing nonsense
      if (now() - saved.startedAt > 12 * 3600000 && saved.stage === "running") { Store.del(KEY); return false; }
      st = saved;
      return true;
    },
    setStage(v) { if (st) { st.stage = v; save(); } },
    /* test hook: shift the run backwards in time, exactly as a real clock would */
    __jump(ms) { if (st) { st.startedAt -= ms; save(); } }
  };
 
  function recordSession(run, actualMs, completedAt, partial) {
    const rec = {
      id: uid(), subjectId: run.subjectId, taskId: run.taskId,
      mode: run.mode, plannedMs: run.plan[run.idx].ms,
      actualMs: Math.round(actualMs), completedAt, partial: !!partial
    };
    S.sessions.push(rec);
    if (S.sessions.length > 2000) S.sessions = S.sessions.slice(-2000);
    persist("sessions");
    if (run.taskId) {
      const t = taskById(run.taskId);
      if (t && !partial) { t.doneSessions = (t.doneSessions || 0) + 1; persist("tasks"); }
    }
  }
 
  return api;
})();

      '<div class="fxnext">' + (nextStep ? (nextStep.type === "focus" ? "Next: " + Math.round(nextStep.ms / 60000) + " min focus" : "Next break: " + Math.round(nextStep.ms / 60000) + " minutes") : "Last one — then you're done") + '</div>' +

        '<div class="fxctl"><button class="fbtn primary" data-a="fxAdvance">Take a ' + Math.round(nextStep.ms / 60000) + ' min break</button></div>' +
        '<button class="fbtn quiet" data-a="fxSkipBreak">Skip the break, keep going</button>'
        : '<div class="fxctl"><button class="fbtn primary" data-a="fxFinish">See summary</button></div>') +

  else if (st.stage === "breakDone") {

        : '<div class="fxctl"><button class="fbtn primary" data-a="fxFinish">See summary</button></div>') +

  }
 
  else { /* routineDone */
    const todayList = Stats.onDay(now());
    const runMs = Stats.totalMs(todayList);

      '</div></div>';
  }
 
  f.innerHTML = bg + top + body;
  startParticles();
  paintTime();
}
 
function paintTime() {
  const st = Engine.state; if (!st || st.stage !== "running") return;
  const t = el("fxTime"); if (!t) return;
  const txt = fmtClock(Engine.remaining());
  if (t.textContent !== txt) {
    t.textContent = txt;
    t.setAttribute("aria-label", txt.split(":").length === 3 ? txt : txt.split(":")[0] + " minutes " + txt.split(":")[1] + " seconds remaining");
  }
  const ring = el("ringProg");
  if (ring) ring.style.strokeDashoffset = (CIRC * Engine.progress()).toFixed(2);
}
 
/* particles — 26 slow motes, paused when hidden or animations off */
let pRAF = null;
function startParticles() {
  cancelAnimationFrame(pRAF);
  const c = el("fxCanvas");
  if (!c || document.documentElement.getAttribute("data-anim") === "off") return;
  const ctx = c.getContext("2d");
  let w, h, parts = [];
  function size() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = c.clientWidth; h = c.clientHeight;
    c.width = w * dpr; c.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  size();
  for (let i = 0; i < 26; i++) parts.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.8 + 0.6, vy: -(Math.random() * 0.14 + 0.03), a: Math.random() * 0.32 + 0.06 });
  let last = 0;
  function frame(ts) {
    pRAF = requestAnimationFrame(frame);
    if (ts - last < 33) return; last = ts;            // ~30fps is plenty, saves battery
    if (c.clientWidth !== w || c.clientHeight !== h) size();
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#fff";
    parts.forEach(p => {
      p.y += p.vy; p.x += Math.sin(p.y / 90) * 0.12;
      if (p.y < -6) { p.y = h + 6; p.x = Math.random() * w; }
      ctx.globalAlpha = p.a; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }
  pRAF = requestAnimationFrame(frame);
}
function stopParticles() { cancelAnimationFrame(pRAF); pRAF = null; }

  mode(v) {

    persist("draft");

  dur(v) {
    S.draft.minutes = parseInt(v, 10);
    const k = S.draft.mode === "pomodoro" ? "focusMin" : S.draft.mode === "deep" ? "deepMin" : "countMin";
    S.settings[k] = S.draft.minutes; persist(); render();
  },
  customDur() {
    prompt2("Custom duration", "How long should each focus session run?", S.draft.minutes, (v) => {
      S.draft.minutes = v;
      const k = S.draft.mode === "pomodoro" ? "focusMin" : S.draft.mode === "deep" ? "deepMin" : "countMin";
      S.settings[k] = v; persist(); closeModal(); render();
    });
  },
  sessions(v) { S.draft.sessions = parseInt(v, 10); S.settings.sessions = S.draft.sessions; persist(); render(); },
  task(v) { S.draft.taskId = v || null; persist("draft"); render(); },
  quick(v) {
    const q = QUICK[parseInt(v, 10)];
    S.draft.mode = q.mode; S.draft.minutes = q.minutes;
    if (q.sessions) S.draft.sessions = q.sessions;
    persist("draft"); actions.start();
  },
  editGoal() {
    prompt2("Daily goal", "How much focus time are you aiming for each day?", S.settings.dailyGoalMin, (v) => {
      S.settings.dailyGoalMin = v; persist("settings"); closeModal();
      if (el("ob").classList.contains("on")) renderOb(); else render();
    });
  },
 
  /* run */
  start() {
    const d = S.draft;
    if (!Engine.start({ mode: d.mode, minutes: d.minutes, sessions: d.sessions, subjectId: d.subjectId, taskId: d.taskId })) return;
    Sound.resume();
    if (!S.settings.audioMuted) {
      if (CustomAudio.hasSound()) CustomAudio.play();
      else if (S.settings.ambient !== "none") Sound.start(S.settings.ambient);
    }
    if (S.settings.notifyFocus || S.settings.notifyBreak) Notify.ask();
    Wake.on();
    lastPaint = ""; renderFocus();
  },
  fxPause() { Engine.pause(); renderFocus(); },
  fxResume() { Engine.resume(); Sound.resume(); renderFocus(); },
  fxAdvance() {
    Engine.advance();
    Sound.resume();
    if (!S.settings.audioMuted && !CustomAudio.hasSound() && S.settings.ambient !== "none" && !Sound.playing) Sound.start(S.settings.ambient);
    renderFocus();
  },
  fxSkipBreak() { Engine.skipBreak(); renderFocus(); },
  fxFinish() { Engine.finish(); afterRun(); },
  fxAskEnd() {
    const remain = fmtClock(Engine.remaining());
    ask("End this session?", remain + " left. Time you've already focused is saved.", "End session", () => {
      Engine.end(); closeModal(); afterRun();
    }, true);
  },
  fxExit() {
    if (Engine.state && Engine.state.stage === "running") { actions.fxAskEnd(); return; }
    Engine.finish(); afterRun();
  },
  fxSound() {
    S.settings.audioMuted = !S.settings.audioMuted;
    persist("settings");

    if (S.settings.audioMuted) {
      Sound.stop();
      /* Mute must pause the custom track without resetting its position. */
      CustomAudio.pauseForMute();
      toast("Audio muted.");
    } else if (Engine.active && Engine.state.stage === "running") {
      Sound.resume();
      /* Resume the custom song from its paused position — never restart it. */
      if (CustomAudio.hasSound()) CustomAudio.play({ restart: false });
      else if (S.settings.ambient !== "none") Sound.start(S.settings.ambient);
      toast("Audio on.");
    }

    lastPaint = "";
    renderFocus();
  },
 
  /* tasks */
  addTask() {
    const title = el("tTitle").value.trim();
    if (!title) { toast("Give the task a name first."); el("tTitle").focus(); return; }
    const est = clamp(parseInt(el("tEst").value, 10) || 1, 1, 12);
    S.tasks.push({ id: uid(), subjectId: el("tSubj").value, title, estSessions: est, doneSessions: 0, done: false });
    persist("tasks"); render(); toast("Task added.");
  },
  toggleTask(v) {
    const t = taskById(v); if (!t) return;
    t.done = !t.done; persist("tasks"); render();
  },
  delTask(v) {
    const t = taskById(v); if (!t) return;
    ask("Delete task?", '"' + t.title + '" will be removed. Study time already logged stays.', "Delete", () => {
      S.tasks = S.tasks.filter(x => x.id !== v);
      if (S.draft.taskId === v) S.draft.taskId = null;
      persist(); closeModal(); render();
    }, true);
  },
 
  /* history + settings */
  range(v) { histRange = v; render(); },
  toggle(v) {
    S.settings[v] = !S.settings[v]; persist("settings");
    if (v === "animations") applyTheme();
    if (v === "keepAwake") { S.settings.keepAwake ? Wake.on() : Wake.off(); }
    render();
  },
  setnum(v) {
    const [k, n] = v.split(":");
    S.settings[k] = parseInt(n, 10);
    if (k === "focusMin" && S.draft.mode === "pomodoro") S.draft.minutes = S.settings.focusMin;
    if (k === "sessions") S.draft.sessions = S.settings.sessions;
    persist();
    if (el("ob").classList.contains("on")) renderOb(); else render();
  },
  theme(v) { S.settings.theme = v; persist("settings"); applyTheme(); render(); },
  ambient(v) {
    S.settings.ambient = v; persist("settings");
    if (v === "none" || S.settings.audioMuted || CustomAudio.hasSound()) Sound.stop();
    else { Sound.resume(); Sound.start(v); if (!Engine.active) setTimeout(() => { if (!Engine.active) Sound.stop(); }, 4200); }
    render();
  },
  askNotify() { Notify.ask().then(r => { render(); toast(r === "granted" ? "Notifications on." : "Notifications stayed off."); }); },
  replayIntro() { obStep = 0; el("ob").classList.add("on"); renderOb(); },
  resetAll() {
    ask("Erase all data?", "Sessions, tasks, subjects and settings on this device. This can't be undone.", "Erase everything", () => {
      ["onboarded", "subjects", "tasks", "sessions", "settings", "draft", "run"].forEach(k => Store.del("lumora." + k));
      closeModal(); location.reload();
    }, true);
  },
 
  /* onboarding + modal */
  obNext() {
    if (obStep >= 4) {
      S.onboarded = true; Store.set("lumora.onboarded", true);
      el("ob").classList.remove("on"); render(); actions.start(); return;
    }
    obStep++; renderOb();
  },
  obBack() { obStep = Math.max(0, obStep - 1); renderOb(); },
  obSkip() { S.onboarded = true; Store.set("lumora.onboarded", true); el("ob").classList.remove("on"); render(); },
  modalYes() { const keep = modalConfirm && modalConfirm(); if (!keep) closeModal(); },
  modalNo() { closeModal(); },
};
 
/* ============================================================
   CUSTOM AUDIO CONTROLS
   ============================================================ */
document.addEventListener("click", (e) => {
  const button = e.target.closest("[data-custom-action]");
  if (!button) return;

  const action = button.getAttribute("data-custom-action");

  if (action === "play") CustomAudio.play();
  if (action === "stop") CustomAudio.stop();
  if (action === "remove") CustomAudio.remove();
});

document.addEventListener("change", (e) => {
  if (!e.target || e.target.id !== "customSoundFile") return;

  const file = e.target.files && e.target.files[0];
  if (file) CustomAudio.save(file);

  /* Allows the same file to be selected again later. */
  e.target.value = "";
});
 
/* delegated events */
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-a]");
  if (!b) return;
  const a = b.getAttribute("data-a"), v = b.getAttribute("data-v");
  if (actions[a]) { e.preventDefault(); actions[a](v); }
});
document.addEventListener("input", (e) => {
  if (e.target.getAttribute && e.target.getAttribute("data-a") === "vol") {
    S.settings.ambientVol = clamp(e.target.value / 100, 0, 1);
    Sound.setVol(S.settings.ambientVol);
    CustomAudio.setVolume(S.settings.ambientVol);
    persist("settings");
    const lab = e.target.closest(".set"); if (lab) lab.querySelector(".sl span").textContent = Math.round(S.settings.ambientVol * 100) + "%";
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && el("modal").classList.contains("on")) closeModal();
  if (e.key === "Enter" && el("modal").classList.contains("on") && el("mInput")) { e.preventDefault(); actions.modalYes(); }
  if (e.target.id === "tTitle" && e.key === "Enter") actions.addTask();
  if (e.code === "Space" && Engine.active && Engine.state.stage === "running" && !/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(e.target.tagName)) {
    e.preventDefault(); Engine.paused ? actions.fxResume() : actions.fxPause();
  }
});
 
/* ============================================================
   12. RUN LOOP — interval for truth, rAF for smoothness
   ============================================================ */
let autoT = null;
function afterRun() {
  clearTimeout(autoT);
  Sound.stop(); CustomAudio.stop(); Wake.off(); stopParticles();
  lastPaint = ""; renderFocus(); render();
}
Engine.onChange((ev) => {
  if (ev === "sessionDone") {
    Sound.focusDone();
    Notify.send("Focus session complete.", "focus");
    /* Keep the custom song playing through the completion screen and into the next step. */
    Sound.stop();
  }
  if (ev === "breakDone") {
    Sound.breakDone();
    Notify.send("Your break is over.", "break");
    /* Custom audio continues seamlessly into the next focus session. */
  }
  if (ev === "routineDone") { Sound.routineDone(); Notify.send("Study routine complete.", "focus"); Sound.stop(); CustomAudio.stop(); Wake.off(); }
  if (ev === "advance") {
    const s = Engine.step();
    if (!S.settings.audioMuted) {
      if (CustomAudio.hasSound()) {
        /* Do not restart the song: continue from its current position. */
        CustomAudio.play({ restart: false });
      } else if (s && s.type === "focus" && S.settings.ambient !== "none") {
        Sound.start(S.settings.ambient);
      } else if (s && s.type !== "focus") {
        Sound.stop();
      }
    }
  }
  if (ev === "start" || ev === "resume") {
    Wake.on();
    if (!S.settings.audioMuted) {
      /* A fresh start begins the track; resume continues from the paused position. */
      if (CustomAudio.hasSound()) {
        CustomAudio.play({ restart: ev === "start" });
      } else if (S.settings.ambient !== "none") {
        Sound.start(S.settings.ambient);
      }
    }
  }
  // auto-transitions: show the completion panel briefly, then move on
  clearTimeout(autoT);
  if (ev === "sessionDone" && S.settings.autoBreak && Engine.nextStep()) autoT = setTimeout(() => { if (Engine.active && Engine.state.stage === "sessionDone") actions.fxAdvance(); }, 3600);
  if (ev === "breakDone" && S.settings.autoFocus && Engine.nextStep()) autoT = setTimeout(() => { if (Engine.active && Engine.state.stage === "breakDone") actions.fxAdvance(); }, 2600);
  if (ev !== "end") { lastPaint = ""; renderFocus(); }
});
 
let heartbeat = setInterval(() => {
  if (!Engine.active) return;
  Engine.tick();
  if (Engine.active && Engine.state.stage === "running" && !document.hidden) paintTime();
}, 250);
 
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { stopParticles(); return; }
  Wake.on();
  if (Engine.active) { Engine.tick(); lastPaint = ""; renderFocus(); }   // recompute from timestamps
  render();
});
window.addEventListener("pageshow", () => { if (Engine.active) { Engine.tick(); lastPaint = ""; renderFocus(); } });
window.addEventListener("beforeunload", () => { Sound.stop(); CustomAudio.stop(); Wake.off(); });
 
/* expose the engine + state for debugging and automated testing.
   The UI never reads from here; it exists so the timer can be driven headlessly. */
window.Lumora = { Engine, Stats, Sound, CustomAudio, get state() { return S; }, actions, render, renderFocus, persist };
 
/* ============================================================
   13. BOOT
   ============================================================ */
applyTheme();
renderNav();
render();
CustomAudio.init();
CustomAudio.syncVolume();
 
if (Engine.restore()) {
  Engine.tick();
  renderFocus();
  if (Engine.state && Engine.state.stage === "running" && Engine.step().type === "focus" && S.settings.ambient !== "none") {
    // browsers block audio until a gesture — start it on the first tap
    document.addEventListener("click", function once() {
      Sound.resume();
      if (!S.settings.audioMuted) {
        if (CustomAudio.hasSound()) CustomAudio.play();
        else if (S.settings.ambient !== "none") Sound.start(S.settings.ambient);
      }
      document.removeEventListener("click", once);
    }, { once: true });
  }
  toast("Picked up where you left off.");
} else if (!S.onboarded) {
  el("ob").classList.add("on");
  renderOb();
}
 
/* Register the service worker so the app installs and works offline.
   Skipped automatically on file:// (opening the file directly) since
   service workers require http(s) — the app still runs fine either way. */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => { });
  });
}
})();
 
</script>
